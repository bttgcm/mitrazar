<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mitra Azar — Photo &amp; Video</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
  />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">MITRA AZAR</a>
    <nav>
      <a href="index.html" class="active">Home</a>
      <a href="about.html">About</a>
      <a href="collaborate.html">Collaborate</a>
    </nav>
  </header>

  <main>
    <div id="globe-container"></div>
    <div id="loading">Loading globe…</div>
    <p id="globe-hint"></p>
    <div id="pin-tooltip" class="pin-tooltip hidden"></div>
  </main>

  <div id="location-modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" aria-label="Close">&times;</button>
      <h2 id="modal-title"></h2>
      <p id="modal-body" class="modal-body"></p>
      <div id="modal-photos-wrap">
        <h3>Photos</h3>
        <div id="modal-photos" class="thumb-grid"></div>
      </div>
      <div id="modal-videos-wrap">
        <h3>Video</h3>
        <div id="modal-videos" class="thumb-grid"></div>
      </div>
    </div>
  </div>

  <div id="lightbox" class="lightbox hidden">
    <button class="lightbox-close" aria-label="Close">&times;</button>
    <button class="lightbox-nav lightbox-prev" aria-label="Previous">&#8249;</button>
    <div id="lightbox-content"></div>
    <button class="lightbox-nav lightbox-next" aria-label="Next">&#8250;</button>
    <div id="lightbox-counter" class="lightbox-counter"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
